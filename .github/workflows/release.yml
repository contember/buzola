name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Parse tag
        id: tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing v${VERSION}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Set version and resolve workspace deps
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ steps.tag.outputs.version }}';
            for (const p of ['packages/buzola/package.json', 'packages/codegen/package.json', 'packages/vite-plugin/package.json', 'packages/bun-plugin/package.json']) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = version;
              for (const [dep, val] of Object.entries(pkg.dependencies ?? {})) {
                if (String(val).startsWith('workspace:')) pkg.dependencies[dep] = '^' + version;
              }
              fs.writeFileSync(p, JSON.stringify(pkg, null, '\t') + '\n');
            }
          "

      - name: Publish @buzola/router
        working-directory: packages/buzola
        run: npm publish --provenance --access public

      - name: Publish @buzola/codegen
        working-directory: packages/codegen
        run: npm publish --provenance --access public

      - name: Publish @buzola/vite-plugin
        working-directory: packages/vite-plugin
        run: npm publish --provenance --access public

      - name: Publish @buzola/bun-plugin
        working-directory: packages/bun-plugin
        run: npm publish --provenance --access public
